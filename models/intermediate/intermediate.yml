version: 2

models:
  - name: int_part_availability
    description: "Enriches partsupp data with part catalog attributes and supplier geographic profiles at the composite grain of (part_key, supplier_key)."
    columns:
      - name: part_key
        description: "Foreign key pointing to the part catalog."
        tests:
          - not_null

      - name: supplier_key
        description: "Foreign key pointing to the supplier profile."
        tests:
          - not_null

      - name: supply_cost
        description: "Wholesale procurement cost per unit supplied by the specific vendor."
        tests:
          - not_null

      - name: available_quantity
        description: "Current on-hand inventory count for the given part and supplier."
        tests:
          - not_null

      - name: total_inventory_value
        description: "Total valuation of on-hand inventory: (available_quantity * supply_cost)."
        tests:
          - not_null

  - name: int_order_items
    description: "Line-level grain enriched with order status, customer keys, and item-level unit economics derived from int_part_availability."
    columns:
      - name: order_key
        description: "Header order identifier."
        tests:
          - not_null

      - name: line_number
        description: "Sequential index of the item within the given order."
        tests:
          - not_null

      - name: net_item_sales_amount
        description: "Line revenue after applying customer discount, computed using the calculate_net_amount macro."
        tests:
          - not_null

      - name: supply_cost
        description: "Unit wholesale procurement cost matched from int_part_availability. Tested for not_null to catch missing lookup keys."
        tests:
          - not_null

      - name: total_item_supply_cost
        description: "Total procurement cost for this line: (item_quantity * supply_cost)."
        tests:
          - not_null

      - name: item_gross_profit_amount
        description: "Gross margin generated by the item: (net_item_sales_amount - total_item_supply_cost)."
        tests:
          - not_null

  - name: int_customers_with_region
    description: "Customer profile enriched with geographic hierarchy (nation and region attributes)."
    columns:
      - name: customer_key
        description: "Primary key of the customer."
        tests:
          - unique
          - not_null

      - name: customer_name
        tests:
          - not_null

      - name: nation_name
        tests:
          - not_null

      - name: region_name
        tests:
          - not_null

  - name: int_suppliers_with_region
    description: "Supplier profile enriched with geographic hierarchy (nation and region attributes)."
    columns:
      - name: supplier_key
        description: "Primary key of the supplier."
        tests:
          - unique
          - not_null

      - name: supplier_name
        tests:
          - not_null

      - name: nation_name
        tests:
          - not_null

      - name: region_name
        tests:
          - not_null

  - name: int_customer_order_summary
    description: "Pre-aggregated customer-level lifetime order count, date boundaries, and total spend."
    columns:
      - name: customer_key
        description: "Primary key for customer order metrics."
        tests:
          - unique
          - not_null

      - name: first_order_date
        description: "Date of the customer's first completed or placed order."
        tests:
          - not_null

      - name: most_recent_order_date
        description: "Date of the customer's most recent order."
        tests:
          - not_null

      - name: total_orders
        description: "Total count of orders placed by the customer."
        tests:
          - not_null

      - name: lifetime_total_spend
        description: "Cumulative net spend across all orders placed by the customer."
        tests:
          - not_null