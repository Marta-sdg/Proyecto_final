version: 2

models:
#DIMENSIONS
  - name: dim_customers
    description: "Customer dimension containing profile, geographic attributes, and lifetime spending aggregates."
    columns:
      - name: customer_key
        description: "Primary key of dim_customers."
        tests:
          - unique
          - not_null

      - name: nation_name
        tests:
          - not_null

      - name: has_placed_order
        tests:
          - not_null

  - name: dim_suppliers
    description: "Supplier dimension with geographic and contact details."
    columns:
      - name: supplier_key
        description: "Primary key of dim_suppliers."
        tests:
          - unique
          - not_null

      - name: nation_name
        tests:
          - not_null

  - name: dim_parts
    description: "Part catalog dimension containing manufacturing and categorization attributes."
    columns:
      - name: part_key
        description: "Primary key of dim_parts."
        tests:
          - unique
          - not_null

      - name: retail_price
        tests:
          - not_null

#FACTS
  - name: fct_orders
    description: "Header-level order facts pre-aggregated from line items."
    columns:
      - name: order_key
        description: "Primary key of fct_orders."
        tests:
          - unique
          - not_null

      - name: customer_key
        description: "Foreign key pointing to dim_customers."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: order_date
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']

      - name: net_order_sales_amount
        tests:
          - not_null

  - name: fct_ordered_items
    description: "Atomic line-item fact table with item-level unit economics, margin, and fulfillment flags."
    columns:
      - name: order_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key

      - name: line_number
        tests:
          - not_null

      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key

      - name: part_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parts')
                field: part_key

      - name: supplier_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_key

      - name: item_ship_date
        tests:
          - not_null

      - name: item_receipt_date
        tests:
          - not_null

      - name: net_item_sales_amount
        tests:
          - not_null

      - name: is_receipt_delayed
        tests:
          - not_null
          
# UNIT TESTS
unit_tests:
  - name: test_fct_ordered_items_latency_and_profit
    description: "Unit tests delivery latency check and profit margin calculations with static mock inputs."
    model: fct_ordered_items
    given:
      - input: ref('int_order_items')
        rows:
          - order_key: 101
            line_number: 1
            customer_key: 1001
            part_key: 501
            supplier_key: 301
            order_date: '1995-03-01'
            item_ship_date: '1995-03-05'
            item_commit_date: '1995-03-15'
            item_receipt_date: '1995-03-12'
            order_status: 'O'
            item_return_flag: 'N'
            item_status: 'O'
            item_ship_mode: 'AIR'
            item_ship_instruct: 'DELIVER'
            item_quantity: 2
            item_extended_price: 200.00
            item_discount: 0.10
            item_tax: 0.05
            discount_amount: 20.00
            net_item_sales_amount: 180.00
            gross_item_sales_amount_with_tax: 189.00
            supply_cost: 40.00
            total_item_supply_cost: 80.00
            item_gross_profit_amount: 100.00

          - order_key: 102
            line_number: 1
            customer_key: 1002
            part_key: 502
            supplier_key: 302
            order_date: '1995-03-01'
            item_ship_date: '1995-03-05'
            item_commit_date: '1995-03-10'
            item_receipt_date: '1995-03-16'
            order_status: 'O'
            item_return_flag: 'N'
            item_status: 'O'
            item_ship_mode: 'MAIL'
            item_ship_instruct: 'NONE'
            item_quantity: 1
            item_extended_price: 50.00
            item_discount: 0.00
            item_tax: 0.00
            discount_amount: 0.00
            net_item_sales_amount: 50.00
            gross_item_sales_amount_with_tax: 50.00
            supply_cost: 30.00
            total_item_supply_cost: 30.00
            item_gross_profit_amount: 20.00
    expect:
      rows:
        - order_key: 101
          line_number: 1
          is_receipt_delayed: false
          net_item_sales_amount: 180.00
          item_gross_profit_amount: 100.00

        - order_key: 102
          line_number: 1
          is_receipt_delayed: true
          net_item_sales_amount: 50.00
          item_gross_profit_amount: 20.00