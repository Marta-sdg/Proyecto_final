version: 2

models:
  - name: stg_TPCH_SF1__region
    description: "Staging model for region geographic master data."
    columns:
      - name: region_key
        description: "Primary key of region."
        tests:
          - unique
          - not_null
      - name: region_name
        tests:
          - not_null

  - name: stg_TPCH_SF1__nation
    description: "Staging model for nation geographic lookup data."
    columns:
      - name: nation_key
        description: "Primary key of nation."
        tests:
          - unique
          - not_null
      - name: nation_name
        tests:
          - not_null
      - name: region_key
        description: "Foreign key pointing to region."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__region')
                field: region_key

  - name: stg_TPCH_SF1__supplier
    description: "Staging model for parts suppliers."
    columns:
      - name: supplier_key
        description: "Primary key of supplier."
        tests:
          - unique
          - not_null
      - name: supplier_name
        tests:
          - not_null
      - name: nation_key
        description: "Foreign key pointing to nation."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__nation')
                field: nation_key

  - name: stg_TPCH_SF1__customer
    description: "Staging model for customer profiles."
    columns:
      - name: customer_key
        description: "Primary key of customer."
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: nation_key
        description: "Foreign key pointing to nation."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__nation')
                field: nation_key

  - name: stg_TPCH_SF1__part
    description: "Staging model for catalog parts."
    columns:
      - name: part_key
        description: "Primary key of part."
        tests:
          - unique
          - not_null
      - name: part_name
        tests:
          - not_null
      - name: retail_price
        tests:
          - not_null

  - name: stg_TPCH_SF1__partsupp
    description: "Staging model for part and supplier inventory cross-reference."
    columns:
      - name: part_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__part')
                field: part_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__supplier')
                field: supplier_key
      - name: available_quantity
        tests:
          - not_null
      - name: supply_cost
        tests:
          - not_null

  - name: stg_TPCH_SF1__orders
    description: "Staging model for orders header table."
    columns:
      - name: order_key
        description: "Primary key of orders."
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key pointing to customer."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__customer')
                field: customer_key
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']
      - name: total_price
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null

  - name: stg_TPCH_SF1__lineitem
    description: "Staging model for atomic line-item order details."
    columns:
      - name: order_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__orders')
                field: order_key
      - name: line_number
        tests:
          - not_null
      - name: part_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__part')
                field: part_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_TPCH_SF1__supplier')
                field: supplier_key
      - name: item_quantity
        tests:
          - not_null
      - name: item_extended_price
        tests:
          - not_null
      - name: item_discount
        tests:
          - not_null
      - name: item_tax
        tests:
          - not_null
      - name: item_ship_date
        tests:
          - not_null
      - name: item_commit_date
        tests:
          - not_null
      - name: item_receipt_date
        tests:
          - not_null